<div class="container">
  <div class="header">
    <h2>Lista produktów</h2>
    <button (click)="logout()" class="logout-btn">Wyloguj</button>
  </div>

  <div *ngIf="loading" class="loading">Ładowanie...</div>

  <table *ngIf="!loading" class="product-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nazwa</th>
        <th>Opis</th>
        <th>Ilość</th>
        <th>Cena</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of products">
        <td>{{ product.id }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.description }}</td>
        <td>{{ product.quantity }}</td>
        <td>{{ product.price }} zł</td>
      </tr>
    </tbody>
  </table>
</div>
