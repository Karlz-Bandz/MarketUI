<div id="main-container">
    <h2>Product</h2>
    <p>Product name: {{ product?.name }}</p>
    <p>Description: {{ product?.description }}</p>
    <p>Quantity: {{ product?.quantity }}</p>
    <p>Price: {{ product?.price }}</p>
    @if(isAdminRole) {
        <button (click)="deleteProductById(product!.id)">DELETE</button>
    }
</div>
